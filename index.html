      if (!soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const t = audioCtx.currentTime + i * 0.1;
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        });
      } catch (e) {}
    }

    function burst(host, x, y, emojis) {
      emojis.forEach((em, i) => {
        const s = document.createElement('span');
        s.textContent = em;
        const angle = (i / emojis.length) * Math.PI * 2;
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.setProperty('--x', Math.cos(angle) * 80 + 'px');
        s.style.setProperty('--y', Math.sin(angle) * 80 + 'px');
        host.appendChild(s);
        setTimeout(() => s.remove(), 1000);
      });
    }

    // Name entry
    $('student-name').addEventListener('input', e => {
      const val = e.target.value.trim();
      $('start-btn').disabled = val.length === 0;
      show($('name-error'), false);
    });

    $('start-btn').addEventListener('click', () => {
      studentName = $('student-name').value.trim();
      if (studentName.length === 0) {
        show($('name-error'), true);
        return;
      }
      $('student-name-display').textContent = '👤 ' + studentName;
      show($('student-name-display'), true);
      $('menu-greeting').textContent = `Halo, ${studentName}! 👋`;
      $('results-student').textContent = studentName;
      goToPage(1);
    });

    // Sound toggle
    $('sound-btn').addEventListener('click', e => {
      soundOn = !soundOn;
      e.currentTarget.setAttribute('aria-pressed', String(soundOn));
      show($('snd-on'), soundOn);
      show($('snd-off'), !soundOn);
    });

    // Menu navigation
    document.querySelectorAll('.game-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const page = +btn.dataset.game;
        goToPage(page);
        if (page === 2) startGame1();
        else if (page === 3) startGame2();
        else if (page === 4) startGame3();
        else if (page === 5) startGame4();
        else if (page === 6) startGame5();
        else if (page === 7) showResults();
      });
    });

    // Game 1
    function startGame1() {
      g1Current = 0;
      scores.g1 = 0;
      showG1Question();
    }

    function showG1Question() {
      if (g1Current >= g1Questions.length) {
        updateMenuScore('score1', scores.g1);
        goToPage(1);
        return;
      }
      const animal = g1Questions[g1Current];
      const data = animals[animal];
      $('g1-counter').textContent = `SOAL ${g1Current + 1}/5`;
      $('g1-animal').textContent = data.emoji;
      
      const opts = $('g1-options');
      opts.innerHTML = '';
      data.syllables.forEach((syl, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'syl-btn canva-button font-extrabold';
        btn.style.background = '#fef3c7';
        btn.style.color = '#92400e';
        btn.textContent = syl;
        btn.addEventListener('click', () => checkG1Answer(i === data.kIndex, btn));
        opts.appendChild(btn);
      });
      
      show($('g1-feedback'), false);
      show($('g1-next'), false);
    }

    function checkG1Answer(correct, btn) {
      if (correct) {
        scores.g1 += 20;
        btn.classList.add('correct');
        btn.style.background = '#dcfce7';
        btn.style.color = '#166534';
        const fb = $('g1-feedback');
        fb.textContent = `✅ Hebat, ${studentName}! Jawabanmu benar!`;
        fb.style.background = '#dcfce7';
        fb.style.color = '#166534';
        show(fb, true);
        show($('g1-next'), true);
        playChime([523, 659, 784]);
        burst($('g1-stage'), $('g1-stage').offsetWidth / 2, 80, ['⭐', '👏', '✨', '🌟']);
      } else {
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
        const fb = $('g1-feedback');
        fb.textContent = `💡 Coba lagi, ${studentName}. Cari suku kata yang dimulai dengan huruf K.`;
        fb.style.background = '#fef9c3';
        fb.style.color = '#854d0e';
        show(fb, true);
        playChime([440, 523]);
      }
    }

    $('g1-next')?.addEventListener('click', () => {
      g1Current++;
      showG1Question();
    });

    // Game 2
    function startGame2() {
      g2Current = 0;
      scores.g2 = 0;
      showG2Question();
    }

    function showG2Question() {
      if (g2Current >= g2Questions.length) {
        updateMenuScore('score2', scores.g2);
        goToPage(1);
        return;
      }
      const animal = g2Questions[g2Current];
      const data = animals[animal];
      const correctSyl = data.syllables[0];
      const options = ['KA', 'KI', 'KU', 'KE', 'KO'].filter(s => s !== correctSyl);
      const shuffled = [correctSyl, options[0], options[1]].sort(() => Math.random() - 0.5);
      
      $('g2-counter').textContent = `SOAL ${g2Current + 1}/5`;
      $('g2-animal').textContent = data.emoji;
      
      const opts = $('g2-options');
      opts.innerHTML = '';
      shuffled.forEach(syl => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'syl-btn canva-button font-extrabold';
        btn.style.background = '#e0f2fe';
        btn.style.color = '#0c4a6e';
        btn.textContent = syl;
        btn.addEventListener('click', () => checkG2Answer(syl === correctSyl, btn));
        opts.appendChild(btn);
      });
      
      show($('g2-feedback'), false);
      show($('g2-next'), false);
    }

    function checkG2Answer(correct, btn) {
      if (correct) {
        scores.g2 += 20;
        btn.classList.add('correct');
        btn.style.background = '#dcfce7';
        btn.style.color = '#166534';
        const fb = $('g2-feedback');
        fb.textContent = `✅ Hebat, ${studentName}! Jawabanmu benar!`;
        fb.style.background = '#dcfce7';
        fb.style.color = '#166534';
        show(fb, true);
        show($('g2-next'), true);
        playChime([523, 659, 784]);
        burst($('g2-stage'), $('g2-stage').offsetWidth / 2, 80, ['⭐', '👏', '✨']);
      } else {
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
        const fb = $('g2-feedback');
        fb.textContent = `💡 Coba lagi, ${studentName}.`;
        fb.style.background = '#fef9c3';
        fb.style.color = '#854d0e';
        show(fb, true);
        playChime([440, 523]);
      }
    }

    $('g2-next')?.addEventListener('click', () => {
      g2Current++;
      showG2Question();
    });

    // Game 3
    function startGame3() {
      g3Current = 0;
      scores.g3 = 0;
      showG3Question();
    }

    function showG3Question() {
      if (g3Current >= g3Questions.length) {
        updateMenuScore('score3', scores.g3);
        goToPage(1);
        return;
      }
      const animal = g3Questions[g3Current];
      const data = animals[animal];
      
      $('g3-counter').textContent = `SOAL ${g3Current + 1}/5`;
      $('g3-animal').textContent = data.emoji;
      
      const syls = $('g3-syllables');
      syls.innerHTML = '';
      data.syllables.forEach((syl, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'syl-btn canva-button font-extrabold';
        btn.style.background = '#fef3c7';
        btn.style.color = '#92400e';
        btn.textContent = syl;
        btn.addEventListener('click', () => checkG3Answer(i === data.kIndex, btn));
        syls.appendChild(btn);
      });
      
      show($('g3-feedback'), false);
      show($('g3-next'), false);
    }

    function checkG3Answer(correct, btn) {
      if (correct) {
        scores.g3 += 20;
        btn.classList.add('correct');
        btn.style.background = '#dcfce7';
        btn.style.color = '#166534';
        btn.textContent = '✅ ' + btn.textContent;
        btn.disabled = true;
        const fb = $('g3-feedback');
        fb.textContent = `✅ Hebat, ${studentName}!`;
        fb.style.background = '#dcfce7';
        fb.style.color = '#166534';
        show(fb, true);
        show($('g3-next'), true);
        playChime([523, 659, 784]);
        burst($('g3-stage'), $('g3-stage').offsetWidth / 2, 80, ['⭐', '👏']);
      } else {
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
        btn.style.background = '#fee2e2';
        btn.style.color = '#991b1b';
        const fb = $('g3-feedback');
        fb.textContent = `💡 Coba lagi!`;
        fb.style.background = '#fef9c3';
        fb.style.color = '#854d0e';
        show(fb, true);
        playChime([440]);
        setTimeout(() => {
          btn.style.background = '#fef3c7';
          btn.style.color = '#92400e';
        }, 1000);
      }
    }

    $('g3-next')?.addEventListener('click', () => {
      g3Current++;
      showG3Question();
    });

    // Game 4
    function startGame4() {
      scores.g4 = 0;
      const zones = $('g4-zones');
      zones.innerHTML = '';
      ['KA', 'KI', 'KU', 'KE', 'KO'].forEach(syl => {
        const zone = document.createElement('div');
        zone.className = 'drop-zone flex flex-col items-center justify-center p-4 bg-white/50';
        zone.dataset.syl = syl;
        zone.innerHTML = `<div class="text-4xl font-extrabold mb-2" style="color: #b91c1c;">${syl}</div>`;
        zone.addEventListener('dragover', e => {
          e.preventDefault();
          zone.classList.add('over');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('over');
          const animal = e.dataTransfer.getData('text');
          const piece = document.querySelector(`[data-animal="${animal}"]`);
          if (piece && animals[animal].syllables[0].startsWith(syl)) {
            zone.appendChild(piece);
            piece.draggable = false;
            piece.style.cursor = 'default';
            zone.classList.add('filled');
            scores.g4 += 20;
            playChime([587, 784]);
            checkG4Complete();
          } else {
            playChime([440]);
          }
        });
        zones.appendChild(zone);
      });

      const animalsContainer = $('g4-animals');
      animalsContainer.innerHTML = '';
      ['kambing', 'kucing', 'kura', 'kelinci', 'koala'].forEach(animal => {
        const card = document.createElement('div');
        card.className = 'piece animal-card bg-white cursor-grab';
        card.draggable = true;
        card.dataset.animal = animal;
        card.innerHTML = `<div class="text-6xl">${animals[animal].emoji}</div>`;
        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text', animal);
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        animalsContainer.appendChild(card);
      });

      show($('g4-feedback'), false);
      show($('g4-next'), false);
    }

    function checkG4Complete() {
      const filled = document.querySelectorAll('.drop-zone.filled').length;
      if (filled === 5) {
        const fb = $('g4-feedback');
        fb.textContent = `🎉 Hebat, ${studentName}! Semua benar!`;
        fb.style.background = '#dcfce7';
        fb.style.color = '#166534';
        show(fb, true);
        show($('g4-next'), true);
        updateMenuScore('score4', scores.g4);
        playChime([523, 659, 784, 1046]);
      }
    }

    $('g4-next')?.addEventListener('click', () => goToPage(1));

    // Game 5
    function startGame5() {
      g5Current = 0;
      scores.g5 = 0;
      showG5Question();
    }

    function showG5Question() {
      if (g5Current >= g5Questions.length) {
        updateMenuScore('score5', scores.g5);
        goToPage(1);
        return;
      }
      const animal = g5Questions[g5Current];
      const data = animals[animal];
      const correctSyl = data.syllables[0];
      
      $('g5-counter').textContent = `SOAL ${g5Current + 1}/10`;
      $('g5-animal').textContent = data.emoji;
      
      const opts = $('g5-options');
      opts.innerHTML = '';
      ['KA', 'KI', 'KU', 'KE', 'KO'].forEach(syl => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'syl-btn canva-button font-extrabold text-2xl';
        btn.style.background = '#ddd6fe';
        btn.style.color = '#4c1d95';
        btn.textContent = syl;
        btn.addEventListener('click', () => checkG5Answer(syl === correctSyl, btn));
        opts.appendChild(btn);
      });
      
      show($('g5-feedback'), false);
      show($('g5-next'), false);
    }

    function checkG5Answer(correct, btn) {
      if (correct) {
        scores.g5 += 10;
        btn.classList.add('correct');
        btn.style.background = '#dcfce7';
        btn.style.color = '#166534';
        const fb = $('g5-feedback');
        fb.textContent = `✅ Benar!`;
        fb.style.background = '#dcfce7';
        fb.style.color = '#166534';
        show(fb, true);
        show($('g5-next'), true);
        playChime([659, 784]);
        burst($('g5-stage'), $('g5-stage').offsetWidth / 2, 80, ['⚡', '✨']);
      } else {
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
        const fb = $('g5-feedback');
        fb.textContent = `💡 Coba lagi!`;
        fb.style.background = '#fef9c3';
        fb.style.color = '#854d0e';
        show(fb, true);
        playChime([440]);
      }
    }

    $('g5-next')?.addEventListener('click', () => {
      g5Current++;
      showG5Question();
    });

    // Results
    function showResults() {
      const total = scores.g1 + scores.g2 + scores.g3 + scores.g4 + scores.g5;
      const percentage = Math.round((total / 500) * 100);
      
      $('results-score1').textContent = `${scores.g1}/100`;
      $('results-score2').textContent = `${scores.g2}/100`;
      $('results-score3').textContent = `${scores.g3}/100`;
      $('results-score4').textContent = `${scores.g4}/100`;
      $('results-score5').textContent = `${scores.g5}/100`;
      $('results-total-score').textContent = `${total}/500 (${percentage}%)`;
      
      let icon = '', message = '';
      if (percentage >= 90) {
        icon = '🌟';
        message = `LUAR BIASA! Kamu sangat hebat mengenal suku kata K, ${studentName}!`;
      } else if (percentage >= 80) {
        icon = '⭐';
        message = `HEBAT! Kamu sudah mengenal suku kata K dengan baik, ${studentName}!`;
      } else if (percentage >= 70) {
        icon = '😊';
        message = `BAGUS! Terus berlatih ya, ${studentName}!`;
      } else {
        icon = '💪';
        message = `AYO BERLATIH LAGI! Kamu pasti bisa, ${studentName}!`;
      }
      
      $('achievement-icon').textContent = icon;
      $('achievement-message').textContent = message;
    }

    function updateMenuScore(id, score) {
      const el = $(id);
      if (el) el.textContent = `Skor: ${score}/100`;
      const total = scores.g1 + scores.g2 + scores.g3 + scores.g4 + scores.g5;
      $('total-score').textContent = `${total} / 500`;
    }

    // Initialize
    goToPage(0);
    lucide.createIcons();
  </script>
 </body>
</html>
